name: "每日自动执行"
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
jobs:
  run:
    # 固定 ubuntu-24.04 而不是 ubuntu-latest：ubuntu-latest 已于 2026-10 切换到
    # Ubuntu 26.04，旧版 Playwright（<1.60）会直接报
    # "Playwright does not support chromium on ubuntu26.04-x64" 导致任务中断。
    # 定时任务依赖浏览器自动化，固定 LTS runner 保证可复现。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: app/data
          key: netease-data-${{ github.ref_name }}
          restore-keys: netease-data-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - env:
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          PLAYWRIGHT_HEADLESS: "1"
          TZ: "Asia/Shanghai"
        run: |
          mkdir -p app/data
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          echo "服务已启动，等待任务执行..."
          sleep 1200
          echo "执行完成"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: app/data
          key: netease-data-${{ github.ref_name }}

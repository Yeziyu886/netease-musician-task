name: "首次部署 - 登录账号"
on:
  workflow_dispatch:
jobs:
  setup:
    # 同 daily.yml：固定 LTS runner，避免 ubuntu-latest 升级到 Playwright 不支持的
    # 新发行版时首次部署直接失败
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: app/data
          key: netease-data-${{ github.ref_name }}
          restore-keys: netease-data-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - run: curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /usr/local/bin
      - env:
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          PLAYWRIGHT_HEADLESS: "1"
          TZ: "Asia/Shanghai"
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          mkdir -p app/data
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # 等待 Web 服务就绪（最多 60 秒），避免后续流程在服务未起时空跑
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/login >/dev/null 2>&1 && break
            sleep 2
          done
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          ngrok http 8000 --log=stdout > /tmp/ngrok.log &
          # 等待 ngrok 隧道建立（最多 60 秒）。原实现直接取 tunnels[0]，
          # ngrok 尚未就绪时 python 会抛 IndexError 让整个 step 失败。
          NGROK_URL=""
          for i in $(seq 1 30); do
            NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | python3 -c "import sys,json
          try:
              tunnels = (json.load(sys.stdin) or {}).get('tunnels') or []
              print(tunnels[0]['public_url'] if tunnels else '')
          except Exception:
              print('')" 2>/dev/null || true)
            [ -n "$NGROK_URL" ] && break
            sleep 2
          done
          echo ""
          echo "=========================================="
          if [ -n "$NGROK_URL" ]; then
            echo "🎉 Web 界面地址：$NGROK_URL"
          else
            echo "⚠️ 未能自动获取 ngrok 地址，请查看 /tmp/ngrok.log 或 ngrok 后台"
          fi
          echo "=========================================="
          echo "默认密码: 123456 | 登录后改密码、添加账号"
          echo "完成后到 Actions 页面 Cancel 此 workflow"
          echo "=========================================="
          # 交互等待时间。前面安装+启动约 5 分钟，这里留 50 分钟，
          # 总时长控制在 job 的 timeout-minutes(60) 之内，忘记手动 Cancel 也会正常收尾
          sleep 3000
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: app/data
          key: netease-data-${{ github.ref_name }}
